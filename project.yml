name: FujiRecipes
options:
  bundleIdPrefix: app.fujirecipes
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  FujiKit:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
targets:
  FujiRecipes:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: FujiKit
        product: FujiKit
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: XriiVs6Qfd6WDdrN3g+4gO58XTYf+yB40ku+fNnAJ4Y=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        # GitHub always serves the latest release's asset here; release.sh --local overrides it for tests.
        SPARKLE_FEED_URL: https://github.com/vekaev/fuji-recipes/releases/latest/download/appcast.xml
        PRODUCT_BUNDLE_IDENTIFIER: app.fujirecipes.mac
        PRODUCT_NAME: Fuji Recipes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fuji Recipes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  FujiRecipes-iOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: FujiKit
        product: FujiKit
    settings:
      base:
        PRODUCT_NAME: Fuji Recipes
        PRODUCT_BUNDLE_IDENTIFIER: app.fujirecipes.ios
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fuji Recipes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Reads and writes the custom settings of your Fujifilm camera over USB-C.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
